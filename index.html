<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocol Dice</title>
<style>
:root{--bg:#0c0b0b;--panel:#171414;--ink:#f3eee2;--gold:#d4a72c;--red:#b62929;--line:#443b32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,sans-serif}
header{padding:32px 20px 20px;text-align:center;background:linear-gradient(#211515,#0c0b0b);border-bottom:2px solid var(--red)}
h1{margin:0;font-size:2.2rem;color:#fff}
.tag{color:var(--gold);font-weight:800;letter-spacing:.1em}
main{max-width:520px;margin:auto;padding:24px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;text-align:center}
a.btn{display:block;background:var(--red);color:#fff;text-decoration:none;font-weight:800;padding:16px;border-radius:12px;margin:10px 0;font-size:1.1rem}
a.btn.secondary{background:#2a2420;border:1px solid var(--line)}
p{color:#c6bca8}
</style>
</head>
<body>
<header>
  <div class="tag">ANY WORLD. ONE PROTOCOL.</div>
  <h1>Protocol Dice</h1>
  <p>Setting-agnostic core system</p>
</header>
<main>
  <div class="card">
    <h2>Play</h2>
    <a class="btn" href="app.html">Open Character Sheet App</a>
    <p>Mobile-friendly interactive sheet and roller</p>
  </div>
  <div class="card">
    <h2>Rules</h2>
    <a class="btn secondary" href="CORE_MECHANICS.md">Core Mechanics</a>
    <p>Pure resolution and character skeleton</p>
  </div>
  <div class="card">
    <h2>Resources</h2>
    <p>More tools and guides will appear here as they are created.</p>
  </div>
</main>
</body>
</html>
